name: weekly
# Refresh data, score, freeze this week into the predictions branch, grade anything due, deploy.
on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: weekly
  cancel-in-progress: false
jobs:
  harvest:
    uses: ./.github/workflows/harvest.yml
    with:
      replan: "true"
      fresh_days: "5"
    secrets: inherit
  publish:
    needs: harvest
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    timeout-minutes: 90
    env:
      BF_STATE_KEY: ${{ secrets.BF_STATE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: predictions
          path: record
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Pull the latest state
        run: |
          for A in universe requires npm_universe npm_requires; do scripts/state.sh pull "$A.parquet" "data/$A.parquet"; done
          scripts/state.sh pull models.json data/models.json
          scripts/state.sh pull backtest.json data/backtest.json
          scripts/state.sh pull survival_model.json data/survival_model.json
          scripts/state.sh pull survival.json data/survival.json
          scripts/state.sh pull survival_recal.json data/survival_recal.json
          scripts/state.sh pull revival.json data/revival.json
          scripts/state.sh pull revival_model.json data/revival_model.json
          scripts/state.sh pull survival-release_days.parquet data/release_days.parquet
          for S in 0 1 2 3 4 5; do
            scripts/state.sh pull "rows-$S.parquet.enc" "data/rows-$S.parquet"
            scripts/state.sh pull "status-$S.parquet" "data/status-$S.parquet"
          done
      - name: Score, freeze and grade
        run: uv run busfactor weekly --predictions record/predictions
      - name: Save the frozen week
        working-directory: record
        run: |
          git config user.name "bus-factor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A predictions
          # Only new files may enter this branch: a frozen file is never changed.
          if git diff --cached --name-status | grep -qvE '^A'; then
            echo "refusing to change a frozen file"; exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Freeze predictions for the week"
            git push origin predictions
          fi
      - name: Save site inputs
        run: |
          for F in simulator.parquet site_context.json; do
            scripts/state.sh push "data/$F" "$F"
          done
          scripts/state.sh push data/site_packages.parquet site_packages.parquet.enc
          if [ -f data/npm_site_packages.parquet ]; then
            scripts/state.sh push data/npm_site_packages.parquet npm_site_packages.parquet.enc
            scripts/state.sh push data/npm_simulator.parquet npm_simulator.parquet
            scripts/state.sh push data/compare.json compare.json
          fi
      - name: Build the site
        run: uv run busfactor site --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy, first try
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait for any other deployment to finish
        if: steps.deploy1.outcome == 'failure'
        run: sleep 90
      - name: Deploy, second try
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Keep the schedule alive
        run: |
          # GitHub disables schedules after 60 days without activity. Only commit if main is quiet.
          AGE=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          if [ "$AGE" -gt 45 ]; then
            git config user.name "bus-factor-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u +%F > docs/last_weekly_run.txt
            git add docs/last_weekly_run.txt
            git commit -m "Keep the weekly schedule alive"
            git push origin main
          fi
