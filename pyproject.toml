[project]
name = "busfactor"
version = "0.1.0"
description = "Which widely used PyPI packages rest on very few people, what depends on them, and which are likely to go quiet."
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
  "duckdb>=1.1",
  "httpx>=0.27",
  "jinja2>=3.1",
  "lightgbm>=4.3",
  "numpy>=1.26",
  "packaging>=24",
  "pandas>=2.2",
  "pyarrow>=16",
  "scikit-learn>=1.5",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
busfactor = "busfactor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/busfactor"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
